<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tower Climb — Auto-Battler Prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400..700&family=Silkscreen:wght@400;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles/ui.css" />
</head>
<body>

<div id="stage">
  <!-- Phaser injects its canvas here; it owns the battlefield only. -->
  <div id="game"></div>

  <!-- ============ HTML/CSS overlay UI ============ -->
  <div id="ui">

    <!-- ---------- top bar: where the run stands, and who is in the room ------ -->
    <header id="topbar">

      <!-- Carved floor plaque. Cleared floors and remaining attempts are both
           run state that used to be invisible. -->
      <div id="floor-plaque">
        <span class="eyebrow">FLOOR</span>
        <div class="plaque-read">
          <span id="floor-num">1</span><span id="floor-total" class="dim">/3</span>
        </div>
        <div id="floor-pips" class="pips"></div>
        <div class="tries-row">
          <span class="eyebrow">TRIES</span>
          <div id="lives-pips" class="pips"></div>
        </div>
      </div>

      <!-- The intruder's dossier. -->
      <section id="intruder">
        <div id="hero-portrait"><img id="hero-face" alt="" /></div>

        <div id="hero-readout">
          <div id="hero-line">
            <span class="eyebrow">INTRUDER</span>
            <span id="hero-name">GOLDEN KNIGHT</span>
            <span id="hero-tags"></span>
            <span id="hero-hp-text">0/0</span>
          </div>

          <div class="bar hp-bar">
            <div id="hero-hp-trail" class="trail"></div>
            <div id="hero-hp-fill" class="fill"></div>
            <div class="ticks ticks-8"></div>
          </div>

          <div id="hero-lower">
            <div id="ult-block">
              <span class="eyebrow">ULT</span>
              <div class="bar ult-bar">
                <div id="hero-ult-fill" class="fill"></div>
                <div class="ticks ticks-4"></div>
              </div>
            </div>
            <!-- one chip per unlocked hero skill; UISystem fills these -->
            <div id="hero-skills"></div>
          </div>
        </div>
      </section>

      <!-- The room's name, chiselled into the lintel above the door. -->
      <div id="floor-title">GATEHOUSE</div>

      <!-- Telegraph colour language — the contract the player reads. -->
      <aside id="legend">
        <span class="eyebrow">TELLS</span>
        <div class="legend-row"><i class="swatch red"></i>AoE damage</div>
        <div class="legend-row"><i class="swatch yellow"></i>Buff / heal</div>
        <div class="legend-row"><i class="swatch purple"></i>Control</div>
      </aside>
    </header>

    <!-- ---------- centre banner / telegraph callout ---------- -->
    <div id="callout"></div>

    <div id="banner">
      <h1 id="banner-title">FLOOR 1</h1>
      <p id="banner-sub">Golden Knight</p>
      <button id="banner-btn" type="button">BEGIN</button>
    </div>

    <!-- ---------- bottom bar: what you can spend, and on what ---------- -->
    <footer id="bottombar">

      <div id="resources">
        <div class="res-head">
          <span class="eyebrow">MANA</span>
          <span id="mana-text">6/12</span>
        </div>
        <!-- The signature readout: one socket per mana point, so a summon cost
             is something you count rather than something you calculate. -->
        <div id="mana-shards" class="shards"></div>

        <div class="res-head">
          <span class="eyebrow">ESSENCE</span>
          <span id="essence-text">60</span>
        </div>
        <div class="bar essence-bar">
          <div id="essence-fill" class="fill"></div>
          <div class="ticks ticks-8"></div>
        </div>

        <div id="field-count">
          <b id="alive-num">0</b><span class="dim"> on the field</span>
        </div>
      </div>

      <!-- monster cards are generated by UISystem -->
      <div id="cards"></div>

      <div id="hint">
        <span id="hint-text">Pick a monster, then click anywhere on the battlefield.</span>
      </div>
    </footer>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<script type="module" src="src/main.js"></script>
</body>
</html>
