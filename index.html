<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Tower Climb — Auto-Battler Prototype</title>
<link rel="stylesheet" href="styles/ui.css" />
</head>
<body>

<div id="stage">
  <!-- Phaser injects its canvas here; it owns the battlefield only. -->
  <div id="game"></div>

  <!-- ============ HTML/CSS overlay UI ============ -->
  <div id="ui">

    <!-- ---------- top bar ---------- -->
    <header id="topbar">
      <div id="floor-badge">
        <span class="label">FLOOR</span>
        <span id="floor-num">1</span><span class="dim">/3</span>
      </div>

      <div id="hero-block">
        <div id="hero-line">
          <span id="hero-name">GOLDEN KNIGHT</span>
          <span id="hero-tags"></span>
          <span id="hero-hp-text">0/0</span>
        </div>
        <div class="bar hp-bar"><div id="hero-hp-fill" class="fill"></div></div>
        <div class="bar ult-bar">
          <div id="hero-ult-fill" class="fill"></div>
          <span class="bar-cap">ULT</span>
        </div>
      </div>

      <div id="legend">
        <div class="legend-row"><i class="swatch red"></i>AoE damage</div>
        <div class="legend-row"><i class="swatch yellow"></i>Buff / heal</div>
        <div class="legend-row"><i class="swatch purple"></i>Control</div>
      </div>
    </header>

    <!-- ---------- centre banner / telegraph callout ---------- -->
    <div id="callout"></div>

    <div id="banner">
      <h1 id="banner-title">FLOOR 1</h1>
      <p id="banner-sub">Golden Knight</p>
      <button id="banner-btn" type="button">BEGIN</button>
    </div>

    <!-- ---------- bottom bar ---------- -->
    <footer id="bottombar">
      <div id="mana-block">
        <div class="mana-line">
          <span class="label">MANA</span>
          <span id="mana-text">6/12</span>
        </div>
        <div class="bar mana-bar"><div id="mana-fill" class="fill"></div></div>
        <div class="mana-line essence-line">
          <span class="label dim">ESSENCE</span>
          <span id="essence-text">60</span>
        </div>
        <div class="bar essence-bar"><div id="essence-fill" class="fill"></div></div>
      </div>

      <!-- monster cards are generated by UISystem -->
      <div id="cards"></div>

      <div id="hint">
        <span id="hint-text">Pick a monster, then click anywhere on the battlefield.</span>
      </div>
    </footer>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/phaser@3.80.1/dist/phaser.min.js"></script>
<script type="module" src="src/main.js"></script>
</body>
</html>
